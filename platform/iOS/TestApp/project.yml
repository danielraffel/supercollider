name: SCiOSTest
options:
  bundleIdPrefix: com.supercollider
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_OBJC_BRIDGING_HEADER: SCiOSTest/SC_iOSLibSynth-Bridging-Header.h
    CLANG_CXX_LANGUAGE_STANDARD: c++17

targets:
  SCiOSTest:
    type: application
    platform: iOS
    sources:
      - path: SCiOSTest
        excludes:
          - "*.plist"
          - Examples
      - path: SCiOSTest/Assets.xcassets
      - path: ../../../SCClassLibrary
        buildPhase: resources
        type: folder
      - path: SCiOSTest/Examples
        buildPhase: resources
        type: folder
    info:
      path: SCiOSTest/Info.plist
      properties:
        NSMicrophoneUsageDescription: "SuperCollider uses the microphone for audio input processing (SoundIn UGen)."
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.supercollider.sciostest
        DEVELOPMENT_TEAM: 95CX6P84C4
        CODE_SIGN_IDENTITY: "iPhone Developer"
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/../../../server/scsynth
          - $(PROJECT_DIR)/../../../lang
          - $(PROJECT_DIR)/../../../include/plugin_interface
          - $(PROJECT_DIR)/../../../include/common
          - $(PROJECT_DIR)/../../../include/server
        OTHER_LDFLAGS:
          - -lstdc++
          - -lc++
    dependencies:
      - framework: ../../../build-xcframework/output/SuperCollider.xcframework
        embed: false
      - sdk: Accelerate.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: CoreMIDI.framework
      - sdk: Foundation.framework
